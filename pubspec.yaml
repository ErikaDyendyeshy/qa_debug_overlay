name: qa_debug_overlay
description: "In-app network inspector for QA: see requests & responses, filter, search and copy cURL, request, response or auth token in one tap."
version: 1.1.0
homepage: https://github.com/ErikaDyendyeshy/qa_debug_overlay
repository: https://github.com/ErikaDyendyeshy/qa_debug_overlay
issue_tracker: https://github.com/ErikaDyendyeshy/qa_debug_overlay/issues
topics:
  - debug
  - network
  - qa
  - dio
  - logging

screenshots:
  - description: QA Debug Overlay — logs list, request details and copy actions.
    path: doc/screenshots/preview.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
